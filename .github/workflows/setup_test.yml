name: setup test
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  make:
    runs-on: macos-latest # 最新の macOS ランナーを使う

    defaults:
      run:
        shell: bash

    steps:
      - name: リポジトリをチェックアウトする
        uses: actions/checkout@v6

      - name: スクリプトに実行権限を付与する
        run: |
          chmod +x .bin/init.sh
          chmod +x .bin/macos_custom_settings.sh
          chmod +x .bin/brew.sh

      - name: dotfiles セットアップを実行する
        run: make

      - name: mise 管理のツールを確認する
        run: |
          eval "$(mise activate bash)"
          mise doctor
          node -v
          python3 --version
          go version
          gh --version
          aws --version

      - name: CLI の PATH を確認する
        run: |
          eval "$(mise activate bash)"
          which brew
          which mise
          which gh
          which aws
          which tree
          which dockutil
          which ngrok || true
